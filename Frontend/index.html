<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyPilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- NAV (hidden until logged in) -->
<nav id="main-nav" style="display:none">
  <div class="logo">StudyPilot</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('dashboard')">Dashboard</button>
    <button class="nav-tab" onclick="showPage('profile')">Profile</button>
  </div>
  <div class="user-badge">
    <div class="avatar" id="nav-avatar" onclick="showPage('profile')" style="cursor:pointer">?</div>
    <span id="nav-username">—</span>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- AUTH PAGE -->
<div id="auth-page" class="page active">
  <div class="auth-card">
    <div class="auth-title">StudyPilot ✈️</div>
    <div class="auth-subtitle">Your personal academic co-pilot</div>

    <div class="auth-toggle">
      <button class="active" onclick="switchAuth('login')">Login</button>
      <button onclick="switchAuth('register')">Register</button>
    </div>

    <!-- Login -->
    <div id="login-form">
      <div class="field">
        <label>USERNAME</label>
        <input type="text" id="login-username" placeholder="Enter your username"/>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" id="login-password" placeholder="Enter your password"/>
      </div>
      <button class="btn-primary" onclick="login()">Login</button>
      <div id="login-msg" class="msg"></div>
    </div>

    <!-- Register -->
    <div id="register-form" style="display:none">
      <div class="field">
        <label>USERNAME</label>
        <input type="text" id="reg-username" placeholder="Choose a username"/>
      </div>
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="reg-email" placeholder="your@email.com"/>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" id="reg-password" placeholder="Choose a password"/>
      </div>
      <button class="btn-primary" onclick="register()">Create Account</button>
      <div id="register-msg" class="msg"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboard-page" class="page">
  <div class="dash-header">
    <h1>Good to see you, <span id="dash-username">—</span> 👋</h1>
    <p>Here's what's on your plate today.</p>
  </div>

  <div class="dash-grid">
    <!-- TODOS -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="dot dot-purple"></span> To-Do List</div>
      </div>
      <div class="add-form">
        <input type="text" id="todo-title" placeholder="Task name"/>
        <input type="datetime-local" id="todo-deadline"/>
        <select id="todo-priority">
          <option value="0">Low</option>
          <option value="1">Medium</option>
          <option value="2">High</option>
        </select>
        <button class="btn-add" onclick="addTodo()">+ Add</button>
      </div>
      <div class="todo-list" id="todo-list">
        <div class="empty-state">No tasks yet!</div>
      </div>
    </div>

    <!-- CALENDAR EVENTS -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="dot dot-pink"></span> Calendar Events</div>
      </div>
      <div class="add-form">
        <input type="text" id="event-name" placeholder="Event name"/>
        <input type="datetime-local" id="event-start"/>
        <select id="event-type">
          <option value="lecture">Lecture</option>
          <option value="exam">Exam</option>
          <option value="personal">Personal</option>
        </select>
        <button class="btn-add" onclick="addEvent()">+ Add</button>
      </div>
      <div class="event-list" id="event-list">
        <div class="empty-state">No events yet!</div>
      </div>
    </div>
  </div>
</div>

<!-- PROFILE PAGE -->
<div id="profile-page" class="page">
  <div class="profile-card">
    <div class="profile-avatar" id="profile-avatar">?</div>
    <div class="profile-name" id="profile-name">—</div>
    <div class="profile-email" id="profile-email">—</div>
    <div class="profile-row">
      <span>User ID</span>
      <span id="profile-id">—</span>
    </div>
    <div class="profile-row">
      <span>Member since</span>
      <span id="profile-created">—</span>
    </div>
  </div>
</div>

<script>
  const API = 'http://127.0.0.1:8000';
  let token = localStorage.getItem('token') || null;

  if (token) initApp();

  function switchAuth(mode) {
    const btns = document.querySelectorAll('.auth-toggle button');
    if (mode === 'login') {
      btns[0].classList.add('active'); btns[1].classList.remove('active');
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('register-form').style.display = 'none';
    } else {
      btns[1].classList.add('active'); btns[0].classList.remove('active');
      document.getElementById('register-form').style.display = 'block';
      document.getElementById('login-form').style.display = 'none';
    }
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `msg ${type}`;
  }

  async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!username || !email || !password) return showMsg('register-msg', 'Please fill in all fields.', 'error');
    const res = await fetch(`${API}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('register-msg', 'Account created! You can now login.', 'success');
      setTimeout(() => switchAuth('login'), 1500);
    } else {
      showMsg('register-msg', data.detail || 'Registration failed.', 'error');
    }
  }

  async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) return showMsg('login-msg', 'Please fill in all fields.', 'error');
    const body = new URLSearchParams({ username, password });
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const data = await res.json();
    if (res.ok) {
      token = data.access_token;
      localStorage.setItem('token', token);
      initApp();
    } else {
      showMsg('login-msg', data.detail || 'Login failed.', 'error');
    }
  }

  function logout() {
    token = null;
    localStorage.removeItem('token');
    document.getElementById('main-nav').style.display = 'none';
    showPage('auth');
  }

  async function initApp() {
    document.getElementById('main-nav').style.display = 'flex';
    showPage('dashboard');
    await loadProfile();
    await loadTodos();
    await loadEvents();
  }

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`${name}-page`).classList.add('active');
    const tabs = document.querySelectorAll('.nav-tab');
    if (name === 'dashboard') tabs[0].classList.add('active');
    if (name === 'profile') tabs[1].classList.add('active');
  }

  async function loadProfile() {
    const res = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return;
    const user = await res.json();
    const initial = user.username[0].toUpperCase();
    document.getElementById('nav-avatar').textContent = initial;
    document.getElementById('nav-username').textContent = user.username;
    document.getElementById('dash-username').textContent = user.username;
    document.getElementById('profile-avatar').textContent = initial;
    document.getElementById('profile-name').textContent = user.username;
    document.getElementById('profile-email').textContent = user.email;
    document.getElementById('profile-id').textContent = '#' + user.userid;
    document.getElementById('profile-created').textContent = new Date(user.created_at).toLocaleDateString('fi-FI');
  }

  async function loadTodos() {
    const res = await fetch(`${API}/tasks`, { headers: { Authorization: `Bearer ${token}` } });
    const todos = await res.json();
    const list = document.getElementById('todo-list');
    if (!todos.length) { list.innerHTML = '<div class="empty-state">No tasks yet!</div>'; return; }
    list.innerHTML = todos.map(t => `
      <div class="todo-item" id="todo-${t.todoid}">
        <div class="todo-check ${t.completed ? 'done' : ''}" onclick="toggleTodo(${t.todoid}, ${!t.completed})"></div>
        <div class="todo-info">
          <div class="todo-name ${t.completed ? 'done' : ''}">${t.name}</div>
          <div class="todo-meta">${t.deadline ? '📅 ' + new Date(t.deadline).toLocaleDateString('fi-FI') : 'No deadline'}</div>
        </div>
        <span class="priority-badge priority-${t.priority}">${['Low','Medium','High'][t.priority]}</span>
        <button class="btn-del" onclick="deleteTodo(${t.todoid})">✕</button>
      </div>
    `).join('');
  }

  async function addTodo() {
    const title = document.getElementById('todo-title').value.trim();
    const deadline = document.getElementById('todo-deadline').value;
    const priority = document.getElementById('todo-priority').value;
    if (!title) return;
    await fetch(`${API}/tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ title, deadline: deadline || null, priority: parseInt(priority), completed: false })
    });
    document.getElementById('todo-title').value = '';
    document.getElementById('todo-deadline').value = '';
    loadTodos();
  }

  async function deleteTodo(id) {
    await fetch(`${API}/tasks/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    loadTodos();
  }

  async function toggleTodo(id, completed) {
    const res = await fetch(`${API}/tasks/${id}`, { headers: { Authorization: `Bearer ${token}` } });
    const task = await res.json();
    await fetch(`${API}/tasks/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ title: task.name, description: task.description, deadline: task.deadline, priority: task.priority, completed })
    });
    loadTodos();
  }

  async function loadEvents() {
    const res = await fetch(`${API}/events`, { headers: { Authorization: `Bearer ${token}` } });
    const events = await res.json();
    const list = document.getElementById('event-list');
    if (!events.length) { list.innerHTML = '<div class="empty-state">No events yet!</div>'; return; }
    list.innerHTML = events.map(e => `
      <div class="event-item">
        <div class="event-stripe ${e.event_type}"></div>
        <div class="event-info">
          <div class="event-name">${e.name}</div>
          <div class="event-time">📅 ${e.start_time ? new Date(e.start_time).toLocaleString('fi-FI') : '—'}</div>
          <div class="event-type-tag">${e.event_type}</div>
        </div>
        <button class="btn-del" onclick="deleteEvent(${e.eventid})">✕</button>
      </div>
    `).join('');
  }

  async function addEvent() {
    const name = document.getElementById('event-name').value.trim();
    const start_time = document.getElementById('event-start').value;
    const event_type = document.getElementById('event-type').value;
    if (!name || !start_time) return;
    await fetch(`${API}/events`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ name, start_time, event_type })
    });
    document.getElementById('event-name').value = '';
    document.getElementById('event-start').value = '';
    loadEvents();
  }

  async function deleteEvent(id) {
    await fetch(`${API}/events/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    loadEvents();
  }
</script>
</body>
</html>
